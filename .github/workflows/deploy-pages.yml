name: Publicar sitio en GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar carpeta dist
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      # El sitio no requiere compilación: GitHub Pages publica dist tal como está.
      - name: Preparar sitio estático
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
